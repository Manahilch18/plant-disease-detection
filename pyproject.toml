[project]
name = "plant-disease-detection"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
description = "Plant Disease Detection FastAPI Backend"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "tensorflow>=2.16.0",
    "opencv-python>=4.10.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.2",
    "fastapi[standard]",
]
[tool.fastapi]
app = "app:app"